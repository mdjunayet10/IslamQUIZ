name: islamquiz
description: A premium Islamic quiz app for learning correct aqeedah with references.
publish_to: 'none'
version: 1.6.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/islamquiz_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/islamquiz_logo.png
  web:
    generate: true
    image_path: assets/logo/islamquiz_logo.png
    background_color: "#06140F"
    theme_color: "#C9A227"
